<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKRoot Pro · 标志动画</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#28252a;background:#f1f0f0;font-family:system-ui,"Segoe UI",sans-serif}main{min-height:100svh;max-width:1200px;margin:auto;padding:32px 44px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;font-size:13px}.brand{font-weight:650;letter-spacing:.04em}.edition{margin-left:8px;color:#7c3aed;font-size:10px;letter-spacing:.12em}.meta{color:#898389;letter-spacing:.13em;font-size:10px}.stage{position:relative;flex:1;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;transition:background .25s}.stage svg{width:min(720px,90%);height:auto;overflow:visible}.caption{font-size:12px;color:#948a90;letter-spacing:.16em;margin-top:-16px}footer{padding-top:24px;border-top:1px solid #dedbde;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.timing{font-size:12px;color:#817980;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:12px;border:1px solid #d9d3d7;border-radius:8px;padding:11px 16px;background:transparent;color:#494049;cursor:pointer}button:hover{border-color:#9960e8;color:#7030d6}button.primary{background:#29242a;border-color:#29242a;color:white}button:focus-visible{outline:3px solid #cbb4f4;outline-offset:3px}body.dark{background:#161419;color:#f3eff1}body.dark .stage{background:#161419}body.dark footer{border-color:#3c343e}body.dark button{color:#ebe2e9;border-color:#554652}body.dark button.primary{background:#ede6eb;color:#29242a}.checker{background-color:#fff!important;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.note{font-size:11px;color:#9b9299;margin-top:16px}@media(max-width:600px){main{padding:24px}.stage{min-height:360px}.meta{display:none}footer{align-items:flex-start}.caption{margin-top:8px}}
.playback{display:flex;align-items:center;gap:14px;margin-top:22px;font-size:11px;color:#918799}.playback progress{width:112px;height:3px;border:0;border-radius:3px;overflow:hidden;accent-color:#9660eb}.playback progress::-webkit-progress-bar{background:#e2dce9}.playback progress::-webkit-progress-value{background:#9660eb}.playback progress::-moz-progress-bar{background:#9660eb}button:disabled{opacity:.4;cursor:default}</style></head><body><main>
<header><span class="brand">SKRoot<span class="edition">PRO</span></span><span class="meta">MONOGRAM / MOTION STUDY</span></header>
<section class="stage" aria-label="Logo 动画预览"><svg id="preview-logo" xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 240 128" role="img" aria-labelledby="title desc">
  <title id="title">SKRoot Pro — animated logo</title>
  <desc id="desc">Connected purple SK. The four parts assemble over 1.3 seconds, followed by a gentle highlight sweep every 4.2 seconds. Transparent background. Reduced-motion settings show the finished mark.</desc>
  <style>.static-mark{display:none}#preview-logo[data-motion="static"] #animated-mark{display:none}#preview-logo[data-motion="static"] .static-mark{display:inline}</style>
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="61" y1="69" x2="223" y2="69">
      <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#B16CF5"/>
    </linearGradient>
    <path id="s" d="M73.2 34.5H136.6V53.2H80.1V60.3H130.8C138.8 60.3 143 64.7 143 72.6V78.8H73.2C65.3 78.8 61.2 74.7 61.2 66.9V46.4C61.2 38.5 65.3 34.5 73.2 34.5Z"/>
    <path id="stem" d="M154.3 34.5H173V57.4L154.3 80.6Z"/>
    <path id="bridge" d="M66.6 84.3H154.4L196 34.5H222.4L167.2 103H66.6Q61.2 103 61.2 97.6V89.7Q61.2 84.3 66.6 84.3Z"/>
    <path id="leg" d="M198.6 72.2L222.4 103H198.6L186.7 88Z"/>
    <g id="mark"><use href="#s"/><use href="#stem"/><use href="#bridge"/><use href="#leg"/></g>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".38"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mark-clip"><use href="#s"/><use href="#stem"/><use href="#bridge"/><use href="#leg"/></clipPath>
    <clipPath id="bridge-reveal"><rect x="61" y="30" width="166" height="76">

    </rect></clipPath>
  </defs>
  <g id="animated-mark" transform="translate(-22 -4.5)" fill="url(#ink)">
    <g id="s-entry">
      <use href="#s"/>


    </g>
    <g id="stem-entry">
      <use href="#stem"/>


    </g>
    <g id="bridge-entry" clip-path="url(#bridge-reveal)"><use href="#bridge"/></g>
    <g id="leg-entry">
      <use href="#leg"/>


    </g>
    <g id="loop-highlight" clip-path="url(#mark-clip)">
      <rect x="-150" y="30" width="90" height="76" fill="url(#sheen)">

      </rect>
    </g>
  </g>
  <use class="static-mark" href="#mark" transform="translate(-22 -4.5)" fill="url(#ink)"/>
</svg>
<div class="caption">SKRoot Pro</div><div class="playback"><span id="playback-status" role="status">正在准备</span><progress id="playback-progress" max="1" value="0" aria-label="动画进度"></progress></div></section>
<footer><div class="timing">进场 1.3 秒 · 循环 4.2 秒<br>连体轮廓 / 紫色渐变 / 轻扫高光</div><div class="controls"><button class="primary" id="replay">重播进场</button><button id="pause" aria-pressed="false">暂停动画</button><button id="theme">切换深色</button><button id="checker" aria-pressed="false">透明背景</button></div></footer><div class="note" id="motion-note">正在准备动画预览。</div>
</main><script>
(() => {
  'use strict';
  const logo = document.querySelector('svg');
  const replay = document.getElementById('replay');
  const pause = document.getElementById('pause');
  const status = document.getElementById('playback-status');
  const progress = document.getElementById('playback-progress');
  const note = document.getElementById('motion-note');
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const s = document.getElementById('s-entry');
  const stem = document.getElementById('stem-entry');
  const leg = document.getElementById('leg-entry');
  const bridge = document.querySelector('#bridge-reveal rect');
  const highlight = document.querySelector('#loop-highlight rect');
  let time = 0, last = null, frame = null, playing = false, explicitlyEnabled = false;
  const clamp = value => Math.max(0, Math.min(1, value));
  function ease(value) {
    const x = clamp(value);
    if (x === 0 || x === 1) return x;
    let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) {
      const u = (lo + hi) / 2;
      const bx = 3 * (1-u) * (1-u) * u * .22 + 3 * (1-u) * u * u * .36 + u * u * u;
      if (bx < x) lo = u; else hi = u;
    }
    const u = (lo + hi) / 2;
    return 1 - (1-u) * (1-u) * (1-u);
  }
  function label(text) {
    if (status.textContent !== text) status.textContent = text;
  }
  function draw() {
    const a = clamp(time / .7);
    const b = clamp((time / .98 - .22) / .78);
    const c = clamp((time / 1.15 - .24) / .76);
    const d = clamp((time / 1.25 - .6) / .4);
    s.setAttribute('opacity', a);
    s.setAttribute('transform', `translate(${-14 * (1-ease(a))} 0)`);
    stem.setAttribute('opacity', b);
    stem.setAttribute('transform', `translate(0 ${-12 * (1-ease(b))})`);
    bridge.setAttribute('width', 166 * ease(c));
    leg.setAttribute('opacity', d);
    leg.setAttribute('transform', `translate(${9 * (1-ease(d))} ${10 * (1-ease(d))})`);
    const phase = time < 1.3 ? 0 : ((time - 1.3) % 4.2) / 4.2;
    highlight.setAttribute('x', time < 1.3 ? -150 : -150 + 390 * clamp((phase - .08) / .4));
    progress.value = time < 1.3 ? time / 1.3 : phase;
    if (playing) label(time < 1.3 ? '进场播放中' : '高光循环中');
  }
  function tick(now) {
    if (!playing) return;
    if (last !== null) time += Math.max(0, now-last) / 1000;
    last = now;
    draw();
    frame = requestAnimationFrame(tick);
  }
  function stop() {
    playing = false;
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    last = null;
  }
  function play(reset = false, manual = true) {
    stop();
    if (manual) explicitlyEnabled = true;
    if (reset) time = 0;
    logo.dataset.motion = 'play';
    playing = true;
    replay.textContent = '重播进场';
    pause.disabled = false;
    pause.textContent = '暂停动画';
    pause.setAttribute('aria-pressed', 'false');
    note.textContent = preference.matches && explicitlyEnabled
      ? '已手动启用本页动画预览；系统设置保持原样。'
      : '进场结束后持续循环高光，可随时暂停或重播。';
    draw();
    frame = requestAnimationFrame(tick);
  }
  function showStatic() {
    stop();
    logo.dataset.motion = 'static';
    time = 1.3;
    draw();
    replay.textContent = '播放动画';
    pause.disabled = true;
    pause.textContent = '暂停动画';
    pause.setAttribute('aria-pressed', 'false');
    label('静态预览');
    note.textContent = '检测到“减少动态效果”。点击“播放动画”可查看本页动画。';
  }
  replay.addEventListener('click', () => play(true));
  pause.addEventListener('click', () => {
    if (playing) {
      stop();
      pause.textContent = '继续动画';
      pause.setAttribute('aria-pressed', 'true');
      label('已暂停');
    } else play(false);
  });
  document.getElementById('theme').addEventListener('click', event => {
    const dark = document.body.classList.toggle('dark');
    event.currentTarget.textContent = dark ? '切换浅色' : '切换深色';
  });
  document.getElementById('checker').addEventListener('click', event => {
    const checked = document.querySelector('.stage').classList.toggle('checker');
    event.currentTarget.setAttribute('aria-pressed', String(checked));
  });
  document.addEventListener('visibilitychange', () => { last = null; });
  if (preference.addEventListener) preference.addEventListener('change', () => {
    if (!explicitlyEnabled) preference.matches ? showStatic() : play(true, false);
  });
  preference.matches ? showStatic() : play(true, false);
})();
</script></body></html>
